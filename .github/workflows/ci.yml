# CI for event-tickets-with-an-age-gate. Every action is pinned to a release tag. Jobs: build and test
# (unit, fuzz, invariant), Slither, a gas snapshot diff on pull requests, the rules-file
# drift check, and the web build. Nothing here holds a key or deploys anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_VERSION: v1.7.1

jobs:
  contracts:
    name: forge build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: foundry-rs/foundry-toolchain@v1.5.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Install pinned dependencies (OpenZeppelin from npm, forge-std at its tag)
        run: cd contracts && npm install --no-audit --no-fund && npm run install:forge-std
      - name: Build (warnings are errors)
        run: cd contracts && forge build --sizes
      - name: Unit, fuzz and invariant tests
        run: cd contracts && forge test -vvv
      - name: Format check
        run: cd contracts && forge fmt --check src script test

  gas-diff:
    name: forge snapshot --diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.base_ref }}
      - uses: foundry-rs/foundry-toolchain@v1.5.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Snapshot the base branch
        run: |
          cd contracts
          forge install foundry-rs/forge-std@v1.16.2 OpenZeppelin/openzeppelin-contracts@v5.6.1 --no-git
          forge snapshot --snap /tmp/base.gas-snapshot
      - uses: actions/checkout@v4.2.2
        with:
          clean: false
      - name: Diff this branch against the base
        run: |
          cd contracts
          forge install foundry-rs/forge-std@v1.16.2 OpenZeppelin/openzeppelin-contracts@v5.6.1 --no-git
          forge snapshot --diff /tmp/base.gas-snapshot

  slither:
    name: slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: foundry-rs/foundry-toolchain@v1.5.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: cd contracts && npm install --no-audit --no-fund && npm run install:forge-std
      - uses: crytic/slither-action@v0.4.2
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          slither-version: 0.11.6
          fail-on: medium

  # The aderyn job was removed on 15 November 2026: Cyfrin retired Aderyn and withdrew its binaries and npm archives
  # (the release notes of aderyn-v0.6.8 say so; npm marks every version "no longer supported" since 12 November), so
  # `npx @cyfrin/aderyn` fails in a few seconds on every run. Slither above still fails the build at medium severity.
  # A copy already installed keeps working: `npm run lint:aderyn` locally.

  rules-files:
    name: agent rules files match the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: node vendor/redbelly-agent-rules/dist/esm/cli.js --check --out . --only claude,agents,cursor,copilot,gemini

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: npm install
      - run: npm run web:build
